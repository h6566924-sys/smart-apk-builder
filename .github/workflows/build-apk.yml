name: Build APK - build_1791233378545_2nbq
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'معرف البناء'
        required: true
        type: string
        default: 'build_1791233378545_2nbq'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: إنشاء حاوية Capacitor
        working-directory: builds/${{ inputs.build_id }}
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android || true
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.example.myapp","appName":"تطبيقي الذكي","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          fi
          mkdir -p www
          if [ ! -f www/index.html ] && [ ! -f www/index.html ]; then
            cp -r . www/ 2>/dev/null || true
            if [ ! -f www/index.html ]; then echo "<html><head><meta charset=utf-8><title>تطبيقي الذكي</title></head><body><h1>تطبيقي الذكي</h1><p>تم البناء عبر Smart APK Builder</p></body></html>" > www/index.html; fi
          fi
          npx cap add android || true
          npx cap sync android || true
      - name: بناء APK
        working-directory: builds/${{ inputs.build_id }}/android
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug

      - name: البحث عن ملفات APK
        run: |
          echo "البحث في جميع المسارات..."
          find builds/${{ inputs.build_id }} -name "*.apk" -type f -print || true
          ls -R builds/${{ inputs.build_id }}/ || true
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/**/*.apk
            **/build/app/outputs/**/*.apk
            builds/${{ inputs.build_id }}/**/build/outputs/apk/**/*.apk
            builds/${{ inputs.build_id }}/**/build/outputs/**/*.apk
            builds/${{ inputs.build_id }}/**/*.apk
            **/*.apk
          if-no-files-found: warn

