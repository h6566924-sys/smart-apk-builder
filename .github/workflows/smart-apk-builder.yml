name: Smart APK Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Project build type'
        required: true
        default: 'android-native'
      build_tag:
        description: 'Release tag'
        required: true
      app_name:
        description: 'App name'
        required: true
        default: 'Smart App'
      package_name:
        description: 'Android package name'
        required: true
        default: 'com.example.myapp'
      build_variant:
        description: 'Build variant'
        required: true
        default: 'debug'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Read builder configuration
        shell: bash
        run: |
          test -f builder-config.json && cat builder-config.json || true
          echo "BUILD_TYPE=${{ inputs.build_type }}" >> "$GITHUB_ENV"
          echo "APP_NAME=${{ inputs.app_name }}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${{ inputs.package_name }}" >> "$GITHUB_ENV"
          echo "BUILD_TAG=${{ inputs.build_tag }}" >> "$GITHUB_ENV"
          echo "BUILD_VARIANT=${{ inputs.build_variant }}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        if: env.BUILD_TYPE == 'capacitor' || env.BUILD_TYPE == 'react' || env.BUILD_TYPE == 'react-native' || env.BUILD_TYPE == 'vue' || env.BUILD_TYPE == 'angular' || env.BUILD_TYPE == 'web-html'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        if: env.BUILD_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        if: env.BUILD_TYPE != 'flutter'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Native
        if: env.BUILD_TYPE == 'android-native' || env.BUILD_TYPE == 'android-source'
        shell: bash
        run: |
          TASK="assembleDebug"
          [ "$BUILD_VARIANT" = "release" ] && TASK="assembleRelease"
          if [ -x ./gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon $TASK --stacktrace
          else
            gradle --no-daemon $TASK --stacktrace
          fi

      - name: Build Flutter
        if: env.BUILD_TYPE == 'flutter'
        shell: bash
        run: |
          if [ ! -d android ]; then flutter create . --platforms=android; fi
          flutter pub get
          if [ "$BUILD_VARIANT" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Build Node / Capacitor
        if: env.BUILD_TYPE == 'capacitor' || env.BUILD_TYPE == 'react' || env.BUILD_TYPE == 'vue' || env.BUILD_TYPE == 'angular'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            WEB_DIR=dist
            [ -d build ] && [ ! -d dist ] && WEB_DIR=build
            [ -d www ] && [ ! -d dist ] && [ ! -d build ] && WEB_DIR=www
            WEB_DIR="$WEB_DIR" node -e 'const fs=require("fs"),j=JSON.stringify;fs.writeFileSync("capacitor.config.ts","import type { CapacitorConfig } from \"@capacitor/cli\";\nconst config: CapacitorConfig = { appId: "+j(process.env.PACKAGE_NAME)+", appName: "+j(process.env.APP_NAME)+", webDir: "+j(process.env.WEB_DIR)+", bundledWebRuntime: false };\nexport default config;\n")'
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          TASK="assembleDebug"
          [ "$BUILD_VARIANT" = "release" ] && TASK="assembleRelease"
          ./gradlew --no-daemon $TASK --stacktrace

      - name: Build React Native
        if: env.BUILD_TYPE == 'react-native'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          cd android
          chmod +x gradlew
          TASK="assembleDebug"
          [ "$BUILD_VARIANT" = "release" ] && TASK="assembleRelease"
          ./gradlew --no-daemon $TASK --stacktrace

      - name: Build HTML Web App
        if: env.BUILD_TYPE == 'web-html'
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.git' --exclude='www' --exclude='android' --exclude='node_modules' --exclude='dist-apk' ./ www/
          else
            tar --exclude=.git --exclude=www --exclude=android --exclude=node_modules --exclude=dist-apk -cf - . | tar -xf - -C www
          fi
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          TASK="assembleDebug"
          [ "$BUILD_VARIANT" = "release" ] && TASK="assembleRelease"
          ./gradlew --no-daemon $TASK --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          rm -rf dist-apk
          mkdir -p dist-apk
          find . -type f -name '*.apk' -not -path './dist-apk/*' -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            dir=$(dirname "$f" | tr '/ ' '__')
            cp "$f" "dist-apk/${dir}__${base}"
          done
          find dist-apk -type f -name '*.apk' -print -exec ls -lh {} \;
          test -n "$(find dist-apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.run_id }}
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$BUILD_TAG" dist-apk/*.apk --repo "$GITHUB_REPOSITORY" --title "Smart APK - $APP_NAME" --notes "Build $GITHUB_RUN_ID" --target "$GITHUB_SHA"

      - name: Save build metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"run_id":"%s","tag":"%s","app":"%s"}\n' "$GITHUB_RUN_ID" "$BUILD_TAG" "$APP_NAME" > dist-apk/build-info.json
          gh release upload "$BUILD_TAG" dist-apk/build-info.json --repo "$GITHUB_REPOSITORY" --clobber
